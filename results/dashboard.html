<style>
/* Layout: a trading-desk "ticket" — one decision card up top, tabs of evidence below, dense tables in mono. */
:root {
  --bg: #f5f6f4; --panel: #ffffff; --ink: #14181a; --ink-2: #4b5459; --ink-3: #7b858a;
  --rule: #dde1de; --rule-2: #eceeec; --accent: #0f6e78; --accent-soft: #e1eff0;
  --series-1: #2a78d6; --series-base: #8a8f93; --series-2: #eb6834;
  --good: #1f7a3a; --good-soft: #e3f2e7; --bad: #b3261e; --bad-soft: #f8e4e2; --warn: #9a6200; --warn-soft: #fbf0d9;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Public Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111416; --panel: #191d20; --ink: #eef1f0; --ink-2: #b3bcbf; --ink-3: #828c90;
  --rule: #2c3236; --rule-2: #23282b; --accent: #4fb3bd; --accent-soft: #173236;
  --series-1: #3987e5; --series-base: #8e9599; --series-2: #d95926;
  --good: #5cc37a; --good-soft: #17301f; --bad: #ef7a72; --bad-soft: #3a1d1b; --warn: #e2a640; --warn-soft: #33270f;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #111416; --panel: #191d20; --ink: #eef1f0; --ink-2: #b3bcbf; --ink-3: #828c90;
  --rule: #2c3236; --rule-2: #23282b; --accent: #4fb3bd; --accent-soft: #173236;
  --series-1: #3987e5; --series-base: #8e9599; --series-2: #d95926;
  --good: #5cc37a; --good-soft: #17301f; --bad: #ef7a72; --bad-soft: #3a1d1b; --warn: #e2a640; --warn-soft: #33270f;
  color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 48px; }
header.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; margin-bottom: 14px; }
h1 { font-family: var(--display); font-weight: 700; font-size: 1.6rem; margin: 0; letter-spacing: -0.01em; }
.meta { color: var(--ink-3); font-size: 0.82rem; font-family: var(--mono); }
nav.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--rule); margin-bottom: 20px; overflow-x: auto; position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 5; }
nav.tabs button { font: 500 0.92rem var(--body); color: var(--ink-2); background: none; border: 0; padding: 10px 14px; border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
nav.tabs button:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h2 { font-family: var(--display); font-weight: 600; font-size: 1.2rem; margin: 28px 0 8px; text-wrap: balance; }
h3 { font-size: 0.78rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-3); margin: 0 0 6px; }
p { max-width: 68ch; margin: 0 0 10px; }
.muted { color: var(--ink-2); }
.small { font-size: 0.85rem; }
.mono, td.num, .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

.ticket { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 20px; display: grid; gap: 18px; }
.verdict { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.pill { display: inline-flex; align-items: center; gap: 6px; font: 600 0.78rem var(--body); text-transform: uppercase; letter-spacing: 0.06em; padding: 4px 10px; border-radius: 999px; }
.pill.trade { background: var(--good-soft); color: var(--good); }
.pill.notrade { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.ok { background: var(--good-soft); color: var(--good); }
.verdict .headline { font-family: var(--display); font-size: 1.5rem; font-weight: 700; margin: 0; text-wrap: balance; }
.levels { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.levels > div { background: var(--panel); padding: 12px 14px; min-width: 0; }
.levels .v { font-family: var(--mono); font-size: 1.25rem; font-weight: 500; }
.levels .s { color: var(--ink-3); font-size: 0.8rem; }
.prob { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; }
.probbar { position: relative; height: 12px; background: var(--rule-2); border-radius: 6px; overflow: hidden; }
.probbar .ci { position: absolute; top: 0; bottom: 0; background: var(--accent-soft); }
.probbar .pt { position: absolute; top: -2px; bottom: -2px; width: 3px; background: var(--accent); }
.probbar .be { position: absolute; top: -3px; bottom: -3px; width: 0; border-left: 2px dashed var(--ink-3); }
ul.reasons { margin: 0; padding-left: 18px; }
ul.reasons li { margin-bottom: 4px; max-width: 75ch; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.grid2 > * { min-width: 0; }
.card { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 16px; min-width: 0; }
.note { border-left: 3px solid var(--warn); background: var(--warn-soft); padding: 10px 14px; border-radius: 0 8px 8px 0; margin: 12px 0; max-width: 80ch; }
.note.info { border-left-color: var(--accent); background: var(--accent-soft); }

.tablewrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 8px; background: var(--panel); }
table { border-collapse: collapse; width: 100%; font-size: 0.86rem; }
th, td { padding: 7px 10px; text-align: left; border-bottom: 1px solid var(--rule-2); white-space: nowrap; }
th { font-weight: 600; color: var(--ink-2); font-size: 0.76rem; text-transform: uppercase; letter-spacing: 0.04em; background: var(--panel); position: sticky; top: 0; cursor: default; }
th.sort { cursor: pointer; }
th.sort:hover { color: var(--ink); }
td.num, th.num { text-align: right; }
tr.hl td { background: var(--accent-soft); }
td.wrap { white-space: normal; min-width: 220px; }
.pos { color: var(--good); } .neg { color: var(--bad); }
.tag { display: inline-block; font-size: 0.72rem; font-weight: 600; padding: 1px 7px; border-radius: 4px; background: var(--rule-2); color: var(--ink-2); }
.tag.yes { background: var(--good-soft); color: var(--good); }
.tag.no { background: var(--bad-soft); color: var(--bad); }
.tag.weak { background: var(--warn-soft); color: var(--warn); }
.controls { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin: 8px 0 10px; font-size: 0.86rem; }
select, input[type=search] { font: inherit; padding: 5px 8px; border: 1px solid var(--rule); border-radius: 6px; background: var(--panel); color: var(--ink); }
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { fill: var(--ink-3); font: 11px var(--mono); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 0.82rem; color: var(--ink-2); margin: 4px 0 6px; }
.legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
.tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 6px 9px; font: 12px var(--mono); color: var(--ink); box-shadow: 0 4px 14px rgb(0 0 0 / 0.12); white-space: nowrap; z-index: 3; }
.bar { display: inline-block; height: 8px; border-radius: 2px; vertical-align: middle; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 0.88rem; }
.kv dt { color: var(--ink-3); } .kv dd { margin: 0; font-family: var(--mono); }
section[hidden] { display: none !important; }
ol.steps li, ul.plain li { margin-bottom: 6px; max-width: 78ch; }
@media (max-width: 520px) { .verdict .headline { font-size: 1.25rem; } .ticket { padding: 14px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

  const svg = el.querySelector("svg"), tip = el.querySelector(".tip"), xh = el.querySelector(".xh");
  svg.querySelector(".hit").addEventListener("mousemove", ev => {
    const r = svg.getBoundingClientRect(); const px = (ev.clientX - r.left) / r.width * W;
    const xv = x0 + (px - m.l) / (W - m.l - m.r) * (x1 - x0);
    let rows = series.map(se => { let best = se.pts[0]; for (const p of se.pts) if (Math.abs(p.x - xv) < Math.abs(best.x - xv)) best = p; return [se, best]; });
    const p0 = rows[0][1];
    xh.setAttribute("x1", X(p0.x)); xh.setAttribute("x2", X(p0.x)); xh.setAttribute("visibility", "visible");
    tip.hidden = false;
    tip.innerHTML = `<div>${esc(p0.label)}</div>` + rows.map(([se, p]) => `<div><span style="color:${se.color}">●</span> ${esc(se.name)}: ${opts.yfmt ? opts.yfmt(p.y) : p.y.toFixed(3)}${p.extra ? " · " + esc(p.extra) : ""}</div>`).join("");
    const left = Math.min(ev.clientX - r.left + 12, r.width - tip.offsetWidth - 4);
    tip.style.left = Math.max(0, left) + "px"; tip.style.top = (ev.clientY - r.top - 10) + "px";
  });
  svg.querySelector(".hit").addEventListener("mouseleave", () => { tip.hidden = true; xh.setAttribute("visibility", "hidden"); });
}
function niceStep(raw) { const p = Math.pow(10, Math.floor(Math.log10(raw || 1))); const f = raw / p; return (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * p; }

// ---------- calibration chart: predicted vs actual with 95% bars
function calibChart(el, rows) {
  const W = 520, H = 300, m = { l: 48, r: 14, t: 12, b: 36 };
  const mx = Math.min(1, Math.max(0.3, ...rows.map(r => Math.max(r.pred, r.win_hi || 0))) + 0.05);
  const X = v => m.l + v / mx * (W - m.l - m.r), Y = v => H - m.b - v / mx * (H - m.t - m.b);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Predicted versus actual hit rate">`;
  for (let v = 0; v <= mx + 1e-9; v += 0.1) {
    s += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--rule-2)"/><text x="${m.l - 6}" y="${Y(v) + 4}" text-anchor="end">${Math.round(v * 100)}%</text>`;
    s += `<text x="${X(v)}" y="${H - m.b + 16}" text-anchor="middle">${Math.round(v * 100)}%</text>`;
  }
  s += `<line x1="${X(0)}" y1="${Y(0)}" x2="${X(mx)}" y2="${Y(mx)}" stroke="var(--ink-3)" stroke-dasharray="4 4"/>`;
  s += `<text x="${(W + m.l) / 2}" y="${H - 4}" text-anchor="middle">model score (predicted chance)</text>`;
  rows.forEach(r => {
    s += `<line x1="${X(r.pred)}" x2="${X(r.pred)}" y1="${Y(r.win_lo)}" y2="${Y(r.win_hi)}" stroke="var(--series-1)" stroke-width="2"/>`;
    s += `<circle cx="${X(r.pred)}" cy="${Y(r.win)}" r="${Math.max(4, Math.min(9, Math.log10(r.n) * 2))}" fill="var(--series-1)" stroke="var(--panel)" stroke-width="2"><title>score ${pct(r.lo, 0)}–${pct(r.hi, 0)}: reached +3% in ${pct(r.win)} (n = ${num(r.n)})</title></circle>`;
  });
  el.innerHTML = s + "</svg>";
}

// ---------- TOOLS
function renderTools() {
  const el = document.getElementById("tools");
  const F = R.families, base = F.find(f => f.kind === "baseline"), full = F.find(f => f.kind === "full");
  const fams = [...new Set(F.filter(f => f.kind === "add").map(f => f.family))];
  const sig = R.signals;
  const famSig = fam => { const s = sig.filter(x => x.family === fam); return [s.filter(x => x.confirmed).length, s.length]; };
  const rows = fams.map(fm => {
    const a = F.find(f => f.family === fm && f.kind === "add"), d = F.find(f => f.family === fm && f.kind === "drop");
    const [c, n] = famSig(fm);
    return { fm, a, d, c, n, addAuc: a.auc - base.auc, dropAuc: full.auc - d.auc, addNet: a.top1.avg_net - base.top1.avg_net, share: (R.importance_by_family || {})[fm] || 0 };
  }).sort((p, q) => q.addAuc - p.addAuc);
  const verdict = r => (r.addAuc > 0.003 && r.c > 0) ? ["yes", "Earned its weight"] : (r.addAuc > 0.001 || r.c > 0) ? ["weak", "Small or mixed"] : ["no", "No measurable value"];
  const maxA = Math.max(...rows.map(r => Math.abs(r.addAuc)), 0.001);
  el.innerHTML = `
  <p>Every tool family was tested two ways, always against the same yardstick: how volatile the stock already is. Volatility alone explains most of who reaches +3%, so a signal only "works" if it adds something on top.</p>
  <ol class="small">
    <li><b>Family test (walk-forward):</b> a model using only volatility, then volatility plus one family, each trained on past years and scored on the next. The gain in AUC (ranking skill) is shown, plus the change when the family is removed from the full model.</li>
    <li><b>Individual signal test:</b> each signal compared with stocks of the same volatility on the same day, discovered on 2016–2021 and re-checked on 2022–2026, with a Benjamini–Hochberg correction for testing ${sig.length} signals at once.</li>
  </ol>
  <div class="note">Even where a tool family improved the ranking, no combination turned it into a profit after costs. Volatility alone explains almost all of the model's ranking skill (${pct((R.importance_by_family || {}).volatility, 0)} of its decisions). See Backtest evidence.</div>
  <p class="small muted">Baseline (volatility only): AUC ${base.auc.toFixed(3)}. All signals: AUC ${full.auc.toFixed(3)}. Reference case: ${cfgLabel(R.main_config)}.</p>
  <div class="tablewrap"><table><thead><tr><th>Tool family</th><th>Verdict</th><th class="num">AUC gain added to volatility</th><th></th><th class="num">AUC lost if removed</th><th class="num">Model #1 avg net change</th><th class="num">Signals confirmed</th><th class="num">Share of model's decisions</th></tr></thead><tbody>
  ${rows.map(r => { const [k, t] = verdict(r); return `<tr><td>${esc(FAMNAME[r.fm] || r.fm)}</td><td><span class="tag ${k}">${t}</span></td><td class="num ${cls(r.addAuc)}">${r.addAuc >= 0 ? "+" : ""}${r.addAuc.toFixed(4)}</td><td><span class="bar" style="width:${Math.abs(r.addAuc) / maxA * 90}px;background:${r.addAuc >= 0 ? "var(--series-1)" : "var(--series-2)"}"></span></td><td class="num">${r.dropAuc >= 0 ? "" : ""}${r.dropAuc.toFixed(4)}</td><td class="num ${cls(r.addNet)}">${spct(r.addNet, 3)}</td><td class="num">${r.c} / ${r.n}</td><td class="num">${pct(r.share, 1)}</td></tr>`; }).join("")}
  </tbody></table></div>
  <p class="small muted">"Earned its weight" = adds at least 0.003 AUC over volatility alone and at least one of its signals survived the multiple-testing correction and the later-period re-check. "Model #1 avg net change" is noisy (one trade a day) and is shown for completeness.</p>

  <h2>Individual signals</h2>
  <div class="controls">
    <label for="fsel">Family</label><select id="fsel"><option value="">All</option>${Object.keys(FAMNAME).map(k => `<option value="${k}">${FAMNAME[k]}</option>`).join("")}</select>
    <label><input type="checkbox" id="conf"> Confirmed only</label>
    <input type="search" id="q" placeholder="Search signal" aria-label="Search signal">
  </div>
  <div class="tablewrap" style="max-height:560px"><table id="sigt"><thead><tr>
    <th class="sort" data-k="signal">Signal</th><th class="sort" data-k="family">Family</th>
    <th class="sort num" data-k="disc_n">n (2016–21)</th><th class="sort num" data-k="disc_win">Hit when on</th><th class="sort num" data-k="disc_base">Same-volatility base</th><th class="sort num" data-k="disc_lift">Lift</th><th class="sort num" data-k="disc_q">q-value</th>
    <th class="sort num" data-k="conf_n">n (2022–26)</th><th class="sort num" data-k="conf_lift">Lift</th><th class="sort num" data-k="conf_p">p</th><th class="sort num" data-k="conf_net_lift">Net lift / trade</th><th class="sort" data-k="confirmed">Confirmed</th></tr></thead><tbody></tbody></table></div>
  <p class="small muted">Lift = hit rate when the signal is on minus the hit rate of same-volatility stocks that day (percentage points). q-value = false-discovery-adjusted p-value. Confirmed = q &lt; 0.05 in 2016–21 and the same direction with p &lt; 0.05 in 2022–26.
  Market-condition signals (SPY trend, breadth) have the same value for every stock on a given day, so they cannot be ranked stock against stock and appear only in the family test above.</p>`;
  let key = "disc_lift", dir = -1;
  const draw = () => {
    const f = document.getElementById("fsel").value, c = document.getElementById("conf").checked, q = document.getElementById("q").value.toLowerCase();
    const rows = sig.filter(s => (!f || s.family === f) && (!c || s.confirmed) && (!q || s.signal.toLowerCase().includes(q)))
      .sort((a, b) => { const x = a[key], y = b[key]; if (x == null) return 1; if (y == null) return -1; return (x > y ? 1 : x < y ? -1 : 0) * dir; });
    document.querySelector("#sigt tbody").innerHTML = rows.map(s => `<tr><td>${esc(s.signal)}</td><td class="small">${esc(FAMNAME[s.family] || s.family)}</td><td class="num">${num(s.disc_n)}</td><td class="num">${pct(s.disc_win)}</td><td class="num">${pct(s.disc_base)}</td><td class="num ${cls(s.disc_lift)}">${s.disc_lift == null ? "–" : (s.disc_lift * 100).toFixed(2)}</td><td class="num">${s.disc_q == null ? "–" : s.disc_q < 0.001 ? "<0.001" : s.disc_q.toFixed(3)}</td><td class="num">${num(s.conf_n)}</td><td class="num ${cls(s.conf_lift)}">${s.conf_lift == null ? "–" : (s.conf_lift * 100).toFixed(2)}</td><td class="num">${s.conf_p == null ? "–" : s.conf_p < 0.001 ? "<0.001" : s.conf_p.toFixed(3)}</td><td class="num ${cls(s.conf_net_lift)}">${spct(s.conf_net_lift, 3)}</td><td>${s.confirmed ? '<span class="tag yes">yes</span>' : '<span class="tag">no</span>'}</td></tr>`).join("");
  };
  ["fsel", "conf", "q"].forEach(id => document.getElementById(id).addEventListener("input", draw));
  document.querySelectorAll("#sigt th.sort").forEach(th => th.addEventListener("click", () => { if (key === th.dataset.k) dir = -dir; else { key = th.dataset.k; dir = -1; } draw(); }));
  draw();
}

// ---------- METHOD
function renderMethod() {
  const el = document.getElementById("method");
  const B = R.base;
  el.innerHTML = `
  <h2 style="margin-top:0">What the tool does each morning</h2>
  <ol class="steps">
    <li>Takes every NYSE and Nasdaq stock that, as of the previous close, traded above $5 with at least $20 million a day of trading over the last 20 days (about ${num(B.avg_universe)} stocks on a typical day).</li>
    <li>Computes ${R.importance ? R.importance.length : ""} signals for each, using only prices up to the previous close.</li>
    <li>Scores each stock with a gradient-boosted model trained on past years, and picks the highest score.</li>
    <li>Looks up how often stocks with that score range reached +3% before the stop in later years the model had not seen, and what they earned after costs.</li>
    <li>Applies the bar. If it fails, the answer is "no trade", and the best candidate is shown with the reason.</li>
  </ol>
  <h2>How a trade is scored in the backtest</h2>
  <ul class="plain">
    <li>Buy at the official opening price. Target = open + 3%, stop = open − stop distance.</li>
    <li>If the daily bar shows only one level was touched, that settles it. If both were touched, 5-minute bars decide which came first; if both fall inside the same 5-minute bar, it counts as a loss.</li>
    <li>If neither is hit, sell at the close (or at the close of the last day for multi-day holds; a later day that opens beyond a level fills at that open).</li>
    <li>Costs: ${(R.costs.cost_side * 100).toFixed(2)}% per side for spread and slippage, plus ${(R.costs.stop_slip * 100).toFixed(2)}% on stop exits. Alpaca charges no commission.</li>
  </ul>
  <h2>Guarding against fooling ourselves</h2>
  <ul class="plain">
    <li><b>Walk-forward:</b> for each test year ${R.test_years[0]}–${R.test_years[R.test_years.length - 1]}, the model was trained only on earlier rows, with a ${R.embargo_days}-day gap so no training outcome overlaps the test year. Model settings were fixed in advance and never tuned on test years.</li>
    <li><b>Look-ahead audit:</b> ${AUDIT.passed ? `<span class="tag yes">passed</span>` : `<span class="tag no">see notes</span>`} Every signal was recomputed for ${AUDIT.symbols_tested || "a sample of"} random stocks using data cut off at ${(AUDIT.cutoffs || []).length} random dates, with the entry-day bar blanked; all ${Object.keys(AUDIT.features || {}).length} signals matched the full-history values exactly.</li>
    <li><b>Point-in-time universe:</b> the price and liquidity filters use raw (unadjusted) prices as of the previous close, so a later reverse split cannot sneak a penny stock in.</li>
    <li><b>Multiple testing:</b> signal results use a false-discovery-rate correction and a separate later period for confirmation.</li>
    <li><b>Independent review:</b> ${REVIEW ? esc(REVIEW.summary) : "pending"}</li>
  </ul>
  <h2>Limits you should know</h2>
  <ul class="plain">
    <li><b>Delisted stocks are only partly included.</b> Alpaca returns history for many delisted symbols and the tool includes all it lists, but some delisted companies (Twitter, for example) are missing from Alpaca's list, so results lean slightly toward survivors.</li>
    <li>A ticker reused by a different company over time can be mixed up. Dividends are not adjusted (ex-dividend days look like small drops).</li>
    <li>The opening price is assumed fillable with ${(R.costs.cost_side * 100).toFixed(2)}% slippage. Real fills on volatile names at the open can be worse, especially for large orders.</li>
    <li>5-minute bars can hide the order of events inside a bar; ties are counted as losses, which makes results slightly pessimistic.</li>
    <li>The target counts as reached when the high touches it exactly, and a stop fills at the stop price less slippage even when price jumps through it during the day. Both make results slightly optimistic; the same-bar loss rule above pushes the other way.</li>
    <li>The stop distance used live is the one that did best across the out-of-sample years, which flatters it a little. The live log below the Today tab is the only truly untouched test.</li>
    <li>The probability shown is the historical frequency for similar scores. It is not a promise, and markets change.</li>
    <li>Data: Alpaca free plan, full-market (SIP) history from 2016. The pre-market price check uses data delayed 15 minutes, topped up with the IEX feed.</li>
  </ul>
  <p class="note">This is a statistical tool, not financial advice.</p>`;
}

renderToday(); renderCands(); renderBT(); renderTools(); renderMethod();
show(start);
</script>
